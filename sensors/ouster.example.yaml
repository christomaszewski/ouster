# Example rig sensor config for the ouster driver (a thin wrap of upstream ouster-ros). Copy +
# rename per instance (e.g. sensors/ouster_top.yaml), edit for your vehicle, then:
#   ./ouster-up sensors/ouster_top.yaml up -d
# This is also the config CI's `rig certify` job runs against (the launcher-contract gate).
#
# `connection` is the generic, rig-uniform block; tools/render_params.py maps it onto upstream's
# flat connection params (sensor_hostname / udp_dest / lidar_port / imu_port). `driver_params` is
# copied VERBATIM into the node's ros__parameters (ANY key from upstream config/driver_params.yaml)
# — do NOT put connection keys there; they are derived from `connection`.

service: ouster
name: top                       # instance id -> ROS namespace /top; compose project ouster_top (standalone)

connection:
  type: lidar
  lidar:
    sensor_hostname: 192.168.1.50   # REQUIRED: the Ouster sensor's IP or hostname
    udp_dest: 192.168.1.10          # this host's NIC the sensor streams to (omit to auto-detect)
    lidar_port: 7502                # host UDP port for lidar packets (rig doctor checks for clashes)
    imu_port: 7503                  # host UDP port for imu packets   (rig doctor checks for clashes)

ros:
  namespace: top                # -> ouster_ns:=top -> /top/points, /top/imu, ...

driver_params:                  # verbatim ros__parameters overrides; keys from upstream config/driver_params.yaml
  lidar_mode: "1024x10"         # 512x10 | 512x20 | 1024x10 | 1024x20 | 2048x10 | 4096x5
  timestamp_mode: TIME_FROM_INTERNAL_OSC
  udp_profile_lidar: RNG19_RFL8_SIG16_NIR16
  point_type: original
  sensor_frame: ouster_sensor   # upstream defaults are os_sensor / os_lidar / os_imu
  lidar_frame: ouster_lidar
  imu_frame: ouster_imu
  point_cloud_frame: ouster_lidar   # frame clouds/scans are stamped in; must EQUAL the value of
                                    # lidar_frame or sensor_frame, so rename it TOGETHER with them
                                    # (unset -> follows lidar_frame; mismatch -> warn + lidar_frame)
  attempt_reconnect: true       # reconnect after a sensor power-cycle / link loss

# Zenoh session tweaks (rmw_zenoh only, RMW_IMPLEMENTATION=rmw_zenoh_cpp; inert under the default
# Fast DDS). Same knob shape as the rig-infra ros2-bag-logger — keep the fleet's zenoh knobs in
# sync. Rendered into one ZENOH_CONFIG_OVERRIDE export — rmw_zenoh applies the pairs ON TOP of
# the session config it loads (its shipped ROS default, or your ZENOH_SESSION_CONFIG_URI file),
# so untouched keys keep their ROS-tuned values. (Semantics change vs v0.1.2: the knob used to be
# SKIPPED when the deployment set ZENOH_SESSION_CONFIG_URI; now the pairs apply on top of that
# file too.) A bad key is a WARN in the driver log and ignored, so check `logs` after changes.
# Shared memory ships DISABLED in rmw_zenoh and engages per link only where the SUBSCRIBER's
# session also opted in (the bag logger has the identical knob) AND both containers share the
# host IPC namespace (this driver's compose sets ipc: host; the subscriber's must too) — anything
# unmet = silent per-link fallback to TCP loopback, so verify by watching `lo` traffic (the
# /<ns>/points bytes vanish when SHM engages), not by reading configs. Keep every SHM participant
# on the same distro's zenoh.
# zenoh:
#   shared_memory: true         # sugar for transport/shared_memory/enabled=true
#   shm_pool_mb: 256            # sugar for …/transport_optimization/pool_size — sizes the SHM
#                               # pool for what THIS session publishes, and the driver publishes
#                               # the big /<ns>/points clouds, so this is where pool sizing
#                               # matters: size it >= subscriber QoS depth x expanded cloud size
#                               # (rmw default 48 MB holds only ~8-16 clouds; a full pool falls
#                               # back to TCP per message). 256 is the recommended floor here;
#                               # omit to keep the shipped default. Ignored (with a warning)
#                               # unless shared_memory is true. Never set the ZENOH_SHM_ALLOC_SIZE
#                               # env instead — it aliases the same key and silently overrides
#                               # this knob.
#   overrides:                  # any zenoh session-config subtree, flattened to leaf overrides
#     transport:                # and applied LAST (wins over the sugar above on conflict)
#       link: { tx: { batch_size: 16384 } }
