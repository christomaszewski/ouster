# Descriptor for the "rig" vehicle-level orchestrator: how to invoke this driver's per-sensor
# launcher. Descriptive metadata ONLY -- this repo does NOT depend on rig; rig depends on this repo
# (one-way). rig invokes:  <launcher> <config> <mapped-verb>   e.g.  ouster-up <config> up -d
service: ouster
launcher: ouster-up
verbs:
  up: "up -d"
  down: "down"     # supervisor parks on SIGTERM according to config shutdown_state
  status: "ps"       # rig may append `--format json` to parse `docker compose ps`
  logs: "logs"
  config: "config"
  images: "images"
  runtime-images: "runtime-images"
  # Operational-state contract (all three or none — declaring them IS the support claim). The
  # launcher handles these itself (never compose subcommands): standby = driver process
  # stopped + physical STANDBY; activate wakes the sensor before launching the driver;
  # state prints {"state": active|standby|transitioning|down, "detail": ...} JSON on stdout.
  # `up` honors RIG_TARGET_STATE > config `initial_state` > active.
  standby: "standby"
  activate: "activate"
  state: "state"
ros_distro: lyrical

# Example config `rig init` / `rig fetch` scaffold new instances from (copy-then-edit starting
# material). The sensors/*.example.yaml glob would discover it anyway — declaring it makes the
# linkage contractual: registry consumers reach it through the pinned source.repo+rev.
examples:
  - sensors/ouster.example.yaml

# rig's BUILD phase: `rig build` runs <command> <registry> [tag] (cwd = this repo) to build + push
# the runtime image to the fleet registry. `rig certify` checks the compose pulls exactly these
# images from RIG_IMAGE_REGISTRY tagged :RIG_IMAGE_TAG (build/pull agreement).
build:
  command: tools/build_image.sh
  images: [ouster_driver]
  architectures: [arm64, amd64]
  capabilities: {no_cache: true, platforms: true}
  # The git repos the image build would otherwise clone itself (rig >= v0.2.74; older rig ignores
  # the key). rig fetches them into its local git mirrors (`rig src sync`) and exports them to the
  # build as RIG_BUILD_SOURCES, which build_image.sh passes as the Dockerfile's named contexts of
  # the same names, so `rig build --offline` builds without fetching. repo/ref MUST equal the
  # url/version pins in ouster.repos and ouster-sdk.repos: build_image.sh refuses an export at any
  # other commit. Update all three files together.
  sources:
    - name: ouster-ros
      repo: https://github.com/christomaszewski/ouster-ros.git
      ref: c1214cd2f6d8b72be27bab464a667688760b0cc4 # = ouster.repos version
    - name: ouster-sdk
      repo: https://github.com/christomaszewski/ouster-sdk.git
      ref: 8aa86b94b1c75dfcb99159a4147b44d973e52323 # = ouster-sdk.repos version

# One CPU runtime per architecture; no JetPack-specific variants. Rig injects the
# catalog digest through the same full-image override the deploy compose already uses.
images:
  override_env: {ouster_driver: OUSTER_IMAGE}

# Interface packages this service's published types come from — consumed (by rig ≥ v0.2.28, or a
# hand-authored union manifest) to build the deployment's fleet-ros-msgs overlay so the shared bag
# logger can record our topics. Interface packages ONLY, never the driver stack. NOT declared:
# sensor_msgs (PointCloud2/Imu/LaserScan/Image), std_msgs (metadata String), std_srvs, tf2_msgs,
# lifecycle_msgs — ros-base/common_interfaces already carry those. ouster_sensor_msgs (PacketMsg +
# Telemetry msgs, GetConfig/SetConfig/GetMetadata srvs) lives INSIDE the upstream driver repo, so
# repo/ref below MUST equal the url/version pins in ouster.repos (what the image build checks out,
# and build.sources above) — update them together or the overlay's definitions silently skew from
# what this image publishes (schema mismatch in the recorded bag). The image-side identity for
# `rig image audit` is baked at /opt/fleet-msgs/provenance.yaml by tools/fetch_upstream.py, which
# records url+ref from ouster.repos itself (never re-typed from this block) and the commit built.
msgs:
  source:
    - repo: https://github.com/christomaszewski/ouster-ros.git
      ref: c1214cd2f6d8b72be27bab464a667688760b0cc4 # = ouster.repos version
      packages: [ouster_sensor_msgs]

# Host-facing UDP ports rig doctor checks for clashes across sensors (host networking -> ports are
# shared vehicle-wide). Dotted paths into the generic sensor config; values must be ints.
host_ports:
  - "connection.lidar.lidar_port"
  - "connection.lidar.imu_port"

# Persisted sensor metadata (~/.ros/{hostname}_metadata.json) lives in a named volume per instance;
# rig removes it ONLY on final teardown (`rig down --purge`), never on a restart. {name} = instance.
external_volumes:
  - "ouster_{name}_metadata"

# Files rig vendors onto the vehicle to run this driver (the deployable "launch surface"). The
# runtime itself is the published image, so NO src/ or build context belongs here. rigging.yaml
# itself is always vendored by rig, so it is not listed.
launch_surface:
  - ouster-up
  - tools/render_params.py
  - tools/runtime_images.py
  - docker/compose/compose.deploy.yaml
