# Deployment-grade compose for ONE ouster instance — parameterized + launched by `ouster-up`
# (which renders the params file and exports the env vars below). Run it via the launcher, not
# directly.
#
# Multi-instance safe: NO container_name; identity comes from the compose project (the rig-injected
# COMPOSE_PROJECT_NAME, or ouster_<name> standalone — the launcher handles both) and the ROS
# namespace, so several lidars never collide. Health comes from the runtime image's baked
# HEALTHCHECK (the supervisor checks both sensor and driver state).
services:
  driver:
    # Image precedence (Docker Compose interpolation): OUSTER_IMAGE (a full per-service override,
    # e.g. a local ouster_driver:runtime) wins; else the rig-injected fleet policy —
    # RIG_IMAGE_REGISTRY prefixed onto ouster_driver, pulled as :RIG_IMAGE_TAG (what `rig build`
    # pushed); else the bare local ouster_driver:latest (default dev/standalone behavior).
    image: ${OUSTER_IMAGE:-${RIG_IMAGE_REGISTRY:+${RIG_IMAGE_REGISTRY}/}ouster_driver:${RIG_IMAGE_TAG:-latest}}
    network_mode: host          # reach the sensor over UDP + expose ROS 2 topics on the host
    ipc: host                   # shared-memory transport: Fast DDS SHM, and LOAD-BEARING for zenoh
                                # SHM (zenoh.shared_memory) — SHM engages per link only between
                                # sessions sharing the host IPC namespace; else silent TCP fallback
    # Zenoh locks both its own pool and mapped peer segments. Docker's default 8 MiB
    # memlock limit cannot accommodate the configured 256 MiB pool, even with ipc: host.
    ulimits:
      memlock: { soft: -1, hard: -1 }
    restart: unless-stopped
    init: true                 # reap descendants when the supervisor stops the launch process group
    # Lifecycle cleanup + process reaping + physical standby confirmation.
    stop_grace_period: 120s
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      # both RMWs ship in the image; export RMW_IMPLEMENTATION=rmw_zenoh_cpp to switch. The
      # driver NEVER starts a zenoh router — that is rig-managed infrastructure; the session
      # connects out (default tcp/localhost:7447, reachable via host networking).
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      # rig-injectable zenoh session tuning: semicolon-separated config overrides, e.g.
      # ZENOH_CONFIG_OVERRIDE='connect/endpoints=["tcp/192.168.1.1:7447"]' to reach a router
      # that is not on localhost. Empty = zenoh defaults. See docker/README.md.
      ZENOH_CONFIG_OVERRIDE: ${ZENOH_CONFIG_OVERRIDE:-}
      # launcher-rendered zenoh session override pairs from the config's `zenoh:` block (SHM
      # sugar + generic overrides; see the catalog entry in sensors/ouster.example.yaml). The
      # entrypoint appends them to ZENOH_CONFIG_OVERRIDE — AFTER any injected value above, so
      # the config's pairs win on key conflict — ONLY under rmw_zenoh_cpp (inert under Fast
      # DDS, the default). rmw_zenoh applies the pairs on top of whatever session config it
      # loads, so this composes with a deployment-set ZENOH_SESSION_CONFIG_URI file too.
      OUSTER_ZENOH_OVERRIDE: ${OUSTER_ZENOH_OVERRIDE:-}
      # the launcher's instance namespace, so the baked healthcheck probes ITS node
      OUSTER_NAMESPACE: ${OUSTER_NAMESPACE:-}
      OUSTER_NAME: ${OUSTER_NAME:-ouster}
      VEHICLE_ID: ${VEHICLE_ID:-}
      OUSTER_HEALTH_CONFIG: ${OUSTER_HEALTH_CONFIG:-}
      OUSTER_TARGET_STATE: ${OUSTER_TARGET_STATE:-active}
      OUSTER_SHUTDOWN_STATE: ${OUSTER_SHUTDOWN_STATE:-standby}
    volumes:
      # the single rendered params file, read-only (a single-file mount; not nested in any :ro dir)
      - ${OUSTER_PARAMS_HOST}:/etc/ouster_driver/params.yaml:ro
      # persisted sensor metadata (~/.ros/{hostname}_metadata.json) — survives restarts; rig GCs it
      # only on `rig down --purge`. The container runs as root, so ~ resolves to /root. `metadata` is
      # a static local alias for the per-instance external volume named below (compose does NOT
      # interpolate variables in a volume's map KEY — only in values such as `name:`).
      - metadata:/root/.ros
    command: ["python3", "/usr/local/bin/operational_state.py", "serve"]

# Per-instance metadata cache. external: true -> compose only USES it (ouster-up creates it on `up`,
# rig GCs it on `rig down --purge`); the explicit name keeps it un-prefixed so rig can match it
# against rigging.yaml `external_volumes`.
volumes:
  metadata:
    external: true
    name: ouster_${OUSTER_NAME}_metadata
