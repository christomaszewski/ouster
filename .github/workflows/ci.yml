name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ROS_DISTRO: lyrical

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Build the runtime image — the gate that proves the pinned upstream
  # (ouster.repos, ouster-sdk.repos) still fetches through
  # tools/fetch_upstream.py and compiles. This is what catches an upstream
  # version bump that breaks the build. No push: `rig build`
  # (tools/build_image.sh) publishes; CI only validates the build.
  # ---------------------------------------------------------------------------
  build-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        id: buildx
      # Layer caches omit RUN cache mounts. Restore ccache separately, allowing
      # the next source pin to reuse objects from the same compiler environment.
      # Register cache before cache-dance: post steps run in reverse order, so
      # extraction finishes before actions/cache saves and Buildx is removed.
      #
      # Two restore keys. The first prefers a cache saved for the same build
      # files. The second takes the newest cache for this architecture and
      # distro whatever those files were: without it any edit to the Dockerfile,
      # a comment included, started with an empty compiler cache. That is safe
      # because ccache answers from the compiler's and the sources' contents
      # (CCACHE_COMPILERCHECK=content); an entry that no longer applies is
      # simply never hit.
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ouster-ccache
          key: ouster-ccache-v1-${{ runner.os }}-${{ matrix.arch }}-${{ env.ROS_DISTRO }}-${{ hashFiles('docker/Dockerfile.runtime', 'docker/ament_target_dependencies_compat.cmake', 'tools/test_upstream.sh') }}-${{ github.sha }}
          restore-keys: |
            ouster-ccache-v1-${{ runner.os }}-${{ matrix.arch }}-${{ env.ROS_DISTRO }}-${{ hashFiles('docker/Dockerfile.runtime', 'docker/ament_target_dependencies_compat.cmake', 'tools/test_upstream.sh') }}-
            ouster-ccache-v1-${{ runner.os }}-${{ matrix.arch }}-${{ env.ROS_DISTRO }}-
      - name: Restore BuildKit compiler cache mount
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          scratch-dir: ${{ runner.temp }}/ouster-ccache-dance
          cache-map: |
            {
              "${{ runner.temp }}/ouster-ccache": {
                "target": "/root/.cache/ccache",
                "id": "ouster-ccache-${{ env.ROS_DISTRO }}-${{ matrix.arch }}",
                "sharing": "locked"
              }
            }
          skip-extraction: ${{ steps.compiler-cache.outputs.cache-hit }}
      # When the toolchain layers are not in the layer cache, this build downloads
      # about 1.1 GB of packages from the Ubuntu archive, and the mirror a runner
      # is handed can crawl: on 2026-11-10 the amd64 job sat at 100-200 kB/s for 42
      # minutes, and its re-run built the image in 13m29s. So the first attempt
      # has a time limit and a second one follows a failure. The retry does not
      # start over: both attempts use this job's builder, which keeps the layers
      # already built and the apt and compiler cache mounts, so packages already
      # downloaded are not fetched again. A build that fails for a real reason
      # fails twice, the second time from those caches.
      #
      # The apt cache mount is not persisted between runs the way ccache is. It
      # is about 1.2 GB per architecture, and the repository's 10 GB cache limit
      # already holds the layer cache and several generations of compiler cache;
      # evicting the layer cache to keep the downloads would cause the very
      # rebuild they are meant to speed up.
      - name: Build runtime image
        id: build
        continue-on-error: true
        timeout-minutes: 30
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.runtime
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: ouster_driver:ci
          cache-from: type=gha,scope=runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.arch }}
          build-args: |
            ROS_DISTRO=${{ env.ROS_DISTRO }}
      - name: Build runtime image (retry)
        if: steps.build.outcome == 'failure'
        timeout-minutes: 60
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.runtime
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: ouster_driver:ci
          cache-from: type=gha,scope=runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.arch }}
          build-args: |
            ROS_DISTRO=${{ env.ROS_DISTRO }}
      - name: Test SDK bounds, scan timestamps, raw bursts, and backpressure
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.runtime
          target: upstream-tests
          platforms: linux/${{ matrix.arch }}
          push: false
          cache-from: |
            type=gha,scope=runtime-${{ matrix.arch }}
            type=gha,scope=ouster-upstream-tests-${{ matrix.arch }}
          cache-to: type=gha,scope=ouster-upstream-tests-${{ matrix.arch }},mode=max
          build-args: |
            ROS_DISTRO=${{ env.ROS_DISTRO }}
      - name: Test packaged supervisor and ROS temperature topic
        run: |
          docker run --rm --init --network none \
            -e OUSTER_TEST_ENTRYPOINT_DIR=/usr/local/bin \
            -v "$PWD:/workspace:ro" -w /workspace ouster_driver:ci \
            python3 -m unittest discover -s tests -v

  # ---------------------------------------------------------------------------
  # rig launcher contract, executable (see rigging.yaml). `rig certify` runs
  # `ouster-up <config> config` under a poisoned fleet env and asserts the
  # contract held: COMPOSE_PROJECT_NAME honored (no -p), image pulled from
  # RIG_IMAGE_REGISTRY as :RIG_IMAGE_TAG (build/pull agreement), fleet ROS env
  # passed through, deterministic + name-derived output, external-volume match.
  # Bare runner — needs docker compose + PyYAML, not ROS.
  # ---------------------------------------------------------------------------
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: christomaszewski/rig
          path: .rig
      - run: python3 -m pip install --user pyyaml
      - uses: ./.rig/.github/actions/setup-build-probe
      - name: rig certify (launcher and build contracts)
        run: ./.rig/rig certify --repo . --config sensors/ouster.example.yaml --require-build-check

  # ---------------------------------------------------------------------------
  # rig build contract, executable (see rigging.yaml build:). build_image.sh
  # must forward the rig build env into the docker argv: a stub `docker` on
  # PATH records what it would have run, and we assert on it.
  # RIG_BUILD_NO_CACHE=1 => --no-cache --pull (absent without it); ROS_DISTRO
  # and RIG_BASE_IMAGE land as build-args, with standalone fallbacks when unset.
  # ---------------------------------------------------------------------------
  build-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: portable build contract tests
        run: python3 -m unittest discover -s tools -p 'test_build_contract.py' -v

  # ---------------------------------------------------------------------------
  # Operational-state regressions: firmware HTTP behavior, process ownership,
  # recovery ordering, state/health, and launcher contracts. No sensor required.
  # ---------------------------------------------------------------------------
  state-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # vcstool makes the hermetic local-Git fetch/submodule regressions execute.
      - run: python3 -m pip install --user pyyaml vcstool
      - name: lifecycle and launcher regressions
        run: python3 -m unittest discover -s tests -v

  # ---------------------------------------------------------------------------
  # Shell hygiene on the deploy surface (launcher + build script + entrypoints).
  # ---------------------------------------------------------------------------
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck launcher + build script + entrypoints
        run: shellcheck -x ouster-up tools/build_image.sh tools/rig-build.sh tools/test_upstream.sh docker/entrypoints/*.sh
