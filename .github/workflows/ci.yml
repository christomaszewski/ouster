name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ROS_DISTRO: lyrical

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Build the runtime image — the gate that proves the pinned upstream
  # (ouster.repos) still fetches via `vcs import` and compiles. This is what
  # catches an upstream version bump that breaks the build. No push: `rig build`
  # (tools/build_image.sh) publishes; CI only validates the build.
  # ---------------------------------------------------------------------------
  build-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.runtime
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: ouster_driver:ci
          cache-from: type=gha,scope=runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.arch }}
          build-args: |
            ROS_DISTRO=${{ env.ROS_DISTRO }}
      - name: Test packaged supervisor and ROS temperature topic
        run: |
          docker run --rm --init --network none \
            -e OUSTER_TEST_ENTRYPOINT_DIR=/usr/local/bin \
            -v "$PWD:/workspace:ro" -w /workspace ouster_driver:ci \
            python3 -m unittest discover -s tests -v

  # ---------------------------------------------------------------------------
  # rig launcher contract, executable (see rigging.yaml). `rig certify` runs
  # `ouster-up <config> config` under a poisoned fleet env and asserts the
  # contract held: COMPOSE_PROJECT_NAME honored (no -p), image pulled from
  # RIG_IMAGE_REGISTRY as :RIG_IMAGE_TAG (build/pull agreement), fleet ROS env
  # passed through, deterministic + name-derived output, external-volume match.
  # Bare runner — needs docker compose + PyYAML, not ROS.
  # ---------------------------------------------------------------------------
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: christomaszewski/rig
          path: .rig
      - run: python3 -m pip install --user pyyaml
      - uses: ./.rig/.github/actions/setup-build-probe
      - name: rig certify (launcher and build contracts)
        run: ./.rig/rig certify --repo . --config sensors/ouster.example.yaml --require-build-check

  # ---------------------------------------------------------------------------
  # rig build contract, executable (see rigging.yaml build:). build_image.sh
  # must forward the rig build env into the docker argv: a stub `docker` on
  # PATH records what it would have run, and we assert on it.
  # RIG_BUILD_NO_CACHE=1 => --no-cache --pull (absent without it); ROS_DISTRO
  # and RIG_BASE_IMAGE land as build-args, with standalone fallbacks when unset.
  # ---------------------------------------------------------------------------
  build-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: portable build contract tests
        run: python3 -m unittest discover -s tools -p 'test_build_contract.py' -v

  # ---------------------------------------------------------------------------
  # Operational-state regressions: firmware HTTP behavior, process ownership,
  # recovery ordering, state/health, and launcher contracts. No sensor required.
  # ---------------------------------------------------------------------------
  state-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --user pyyaml
      - name: lifecycle and launcher regressions
        run: python3 -m unittest discover -s tests -v

  # ---------------------------------------------------------------------------
  # Shell hygiene on the deploy surface (launcher + build script + entrypoints).
  # ---------------------------------------------------------------------------
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck launcher + build script + entrypoints
        run: shellcheck -x ouster-up tools/build_image.sh tools/rig-build.sh docker/entrypoints/*.sh
