name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ROS_DISTRO: lyrical

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Build the runtime image — the gate that proves the pinned upstream
  # (ouster.repos) still fetches via `vcs import` and compiles. This is what
  # catches an upstream version bump that breaks the build. No push: `rig build`
  # (tools/build_image.sh) publishes; CI only validates the build.
  # ---------------------------------------------------------------------------
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.runtime
          push: false
          load: true
          tags: ouster_driver:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ROS_DISTRO=${{ env.ROS_DISTRO }}
      - name: Test packaged supervisor and ROS temperature topic
        run: |
          docker run --rm --init --network none \
            -e OUSTER_TEST_ENTRYPOINT_DIR=/usr/local/bin \
            -v "$PWD:/workspace:ro" -w /workspace ouster_driver:ci \
            python3 -m unittest discover -s tests -v

  # ---------------------------------------------------------------------------
  # rig launcher contract, executable (see rigging.yaml). `rig certify` runs
  # `ouster-up <config> config` under a poisoned fleet env and asserts the
  # contract held: COMPOSE_PROJECT_NAME honored (no -p), image pulled from
  # RIG_IMAGE_REGISTRY as :RIG_IMAGE_TAG (build/pull agreement), fleet ROS env
  # passed through, deterministic + name-derived output, external-volume match.
  # Bare runner — needs docker compose + PyYAML, not ROS.
  # ---------------------------------------------------------------------------
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: christomaszewski/rig
          path: .rig
      - run: python3 -m pip install --user pyyaml
      - name: rig certify (launcher contract)
        run: ./.rig/rig certify --repo . --config sensors/ouster.example.yaml

  # ---------------------------------------------------------------------------
  # rig build contract, executable (see rigging.yaml build:). build_image.sh
  # must forward the rig build env into the docker argv: a stub `docker` on
  # PATH records what it would have run, and we assert on it.
  # RIG_BUILD_NO_CACHE=1 => --no-cache --pull (absent without it); ROS_DISTRO
  # and RIG_BASE_IMAGE land as build-args, with standalone fallbacks when unset.
  # ---------------------------------------------------------------------------
  build-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build_image.sh forwards the rig build env
        run: |
          mkdir -p "${RUNNER_TEMP}/stub"
          printf '#!/usr/bin/env bash\necho "docker $*" >> "${DOCKER_ARGV_LOG}"\n' \
            > "${RUNNER_TEMP}/stub/docker"
          chmod +x "${RUNNER_TEMP}/stub/docker"
          export PATH="${RUNNER_TEMP}/stub:${PATH}"
          export DOCKER_ARGV_LOG="${RUNNER_TEMP}/argv.log"
          # `! cmd` is exempt from -e, so a surprise success would pass silently
          must_fail() { if "$@" >/dev/null 2>&1; then echo "expected failure: $*"; exit 1; fi; }

          # Bare invocation (no rig env beyond the workflow's ROS_DISTRO=lyrical,
          # which matches the standalone default): no cache-busting flags, and the
          # build-args fall back to the standalone ros-core parent.
          : > "${DOCKER_ARGV_LOG}"
          env -u RIG_BUILD_NO_CACHE -u RIG_BASE_IMAGE \
            tools/build_image.sh reg.example:5000 vtest
          grep -q -- '--build-arg ROS_DISTRO=lyrical' "${DOCKER_ARGV_LOG}"
          grep -q -- '--build-arg BASE_IMAGE=ros:lyrical-ros-core' "${DOCKER_ARGV_LOG}"
          must_fail grep -q -- '--no-cache' "${DOCKER_ARGV_LOG}"
          must_fail grep -q -- '--pull' "${DOCKER_ARGV_LOG}"

          # Full rig env: deliberate rebuild re-pulls the parent, and the
          # deployment's distro + base image are forwarded verbatim.
          : > "${DOCKER_ARGV_LOG}"
          RIG_BUILD_NO_CACHE=1 ROS_DISTRO=zephyrous \
            RIG_BASE_IMAGE=reg.example:5000/fleet-ros:v9 \
            tools/build_image.sh reg.example:5000 vtest
          grep -q -- '--no-cache --pull' "${DOCKER_ARGV_LOG}"
          grep -q -- '--build-arg ROS_DISTRO=zephyrous' "${DOCKER_ARGV_LOG}"
          grep -q -- '--build-arg BASE_IMAGE=reg.example:5000/fleet-ros:v9' "${DOCKER_ARGV_LOG}"

  # ---------------------------------------------------------------------------
  # Operational-state regressions: firmware HTTP behavior, process ownership,
  # recovery ordering, state/health, and launcher contracts. No sensor required.
  # ---------------------------------------------------------------------------
  state-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --user pyyaml
      - name: lifecycle and launcher regressions
        run: python3 -m unittest discover -s tests -v

  # ---------------------------------------------------------------------------
  # Shell hygiene on the deploy surface (launcher + build script + entrypoints).
  # ---------------------------------------------------------------------------
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck launcher + build script + entrypoints
        run: shellcheck ouster-up tools/build_image.sh docker/entrypoints/*.sh
