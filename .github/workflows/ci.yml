name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ROS_DISTRO: lyrical

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Build the runtime image — the gate that proves the pinned upstream
  # (ouster.repos) still fetches via `vcs import` and compiles. This is what
  # catches an upstream version bump that breaks the build. No push: `rig build`
  # (tools/build_image.sh) publishes; CI only validates the build.
  # ---------------------------------------------------------------------------
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.runtime
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ROS_DISTRO=${{ env.ROS_DISTRO }}

  # ---------------------------------------------------------------------------
  # rig launcher contract, executable (see rigging.yaml). `rig certify` runs
  # `ouster-up <config> config` under a poisoned fleet env and asserts the
  # contract held: COMPOSE_PROJECT_NAME honored (no -p), image pulled from
  # RIG_IMAGE_REGISTRY as :RIG_IMAGE_TAG (build/pull agreement), fleet ROS env
  # passed through, deterministic + name-derived output, external-volume match.
  # Bare runner — needs docker compose + PyYAML, not ROS.
  # ---------------------------------------------------------------------------
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: christomaszewski/rig
          path: .rig
      - run: python3 -m pip install --user pyyaml
      - name: rig certify (launcher contract)
        run: ./.rig/rig certify --repo . --config sensors/ouster.example.yaml

  # ---------------------------------------------------------------------------
  # rig build contract, executable (see rigging.yaml build:). build_image.sh
  # must forward the rig build env into the docker argv: a stub `docker` on
  # PATH records what it would have run, and we assert on it.
  # RIG_BUILD_NO_CACHE=1 => --no-cache --pull (absent without it); ROS_DISTRO
  # and RIG_BASE_IMAGE land as build-args, with standalone fallbacks when unset.
  # ---------------------------------------------------------------------------
  build-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build_image.sh forwards the rig build env
        run: |
          mkdir -p "${RUNNER_TEMP}/stub"
          printf '#!/usr/bin/env bash\necho "docker $*" >> "${DOCKER_ARGV_LOG}"\n' \
            > "${RUNNER_TEMP}/stub/docker"
          chmod +x "${RUNNER_TEMP}/stub/docker"
          export PATH="${RUNNER_TEMP}/stub:${PATH}"
          export DOCKER_ARGV_LOG="${RUNNER_TEMP}/argv.log"
          # `! cmd` is exempt from -e, so a surprise success would pass silently
          must_fail() { if "$@" >/dev/null 2>&1; then echo "expected failure: $*"; exit 1; fi; }

          # Bare invocation (no rig env beyond the workflow's ROS_DISTRO=lyrical,
          # which matches the standalone default): no cache-busting flags, and the
          # build-args fall back to the standalone ros-core parent.
          : > "${DOCKER_ARGV_LOG}"
          env -u RIG_BUILD_NO_CACHE -u RIG_BASE_IMAGE \
            tools/build_image.sh reg.example:5000 vtest
          grep -q -- '--build-arg ROS_DISTRO=lyrical' "${DOCKER_ARGV_LOG}"
          grep -q -- '--build-arg BASE_IMAGE=ros:lyrical-ros-core' "${DOCKER_ARGV_LOG}"
          must_fail grep -q -- '--no-cache' "${DOCKER_ARGV_LOG}"
          must_fail grep -q -- '--pull' "${DOCKER_ARGV_LOG}"

          # Full rig env: deliberate rebuild re-pulls the parent, and the
          # deployment's distro + base image are forwarded verbatim.
          : > "${DOCKER_ARGV_LOG}"
          RIG_BUILD_NO_CACHE=1 ROS_DISTRO=zephyrous \
            RIG_BASE_IMAGE=reg.example:5000/fleet-ros:v9 \
            tools/build_image.sh reg.example:5000 vtest
          grep -q -- '--no-cache --pull' "${DOCKER_ARGV_LOG}"
          grep -q -- '--build-arg ROS_DISTRO=zephyrous' "${DOCKER_ARGV_LOG}"
          grep -q -- '--build-arg BASE_IMAGE=reg.example:5000/fleet-ros:v9' "${DOCKER_ARGV_LOG}"

  # ---------------------------------------------------------------------------
  # Operational-state contract, launcher side (see rigging.yaml verbs:). The
  # in-container half (statectl.sh, healthcheck.sh) needs a sensor — hardware
  # validation is a separate matrix — but the launcher's contract surface is
  # testable with a stubbed docker: `state` answers down as JSON on a clean
  # stdout, transitions refuse to create containers, RIG_TARGET_STATE /
  # initial_state are validated, and standby-at-up drives up -d + transition.
  # ---------------------------------------------------------------------------
  state-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --user pyyaml
      - name: launcher state verbs against a stubbed docker
        run: |
          mkdir -p "${RUNNER_TEMP}/stub"
          cat > "${RUNNER_TEMP}/stub/docker" <<'EOF'
          #!/usr/bin/env bash
          echo "docker $*" >> "${DOCKER_ARGV_LOG}"
          case "$*" in
            "compose version") exit 0 ;;
            *" ps -q driver"|*" ps -aq driver") exit 0 ;;   # no containers
            *" exec -T driver "*) exit 1 ;;                 # nothing to exec into
            *) exit 0 ;;
          esac
          EOF
          chmod +x "${RUNNER_TEMP}/stub/docker"
          export PATH="${RUNNER_TEMP}/stub:${PATH}"
          export DOCKER_ARGV_LOG="${RUNNER_TEMP}/argv.log"
          # `! cmd` is exempt from -e, so a surprise success would pass silently
          must_fail() { if "$@" >/dev/null 2>&1; then echo "expected failure: $*"; exit 1; fi; }

          # state on a down project: exactly the JSON on stdout, exit 0, no render left behind
          : > "${DOCKER_ARGV_LOG}"
          out="$(./ouster-up sensors/ouster.example.yaml state)"
          [ "$out" = '{"state": "down", "detail": "no containers"}' ]
          [ ! -e var/run/top.params.yaml ]

          # transitions never create containers: standby/activate fail on a down project,
          # nothing on stdout, and no compose up / volume create was attempted
          : > "${DOCKER_ARGV_LOG}"
          out="$(./ouster-up sensors/ouster.example.yaml standby 2>/dev/null)" \
            && { echo "standby succeeded on a down project"; exit 1; }
          [ -z "$out" ]
          must_fail ./ouster-up sensors/ouster.example.yaml activate
          must_fail grep -qE ' up | volume create ' "${DOCKER_ARGV_LOG}"

          # initial-state validation is a hard error, before anything runs
          must_fail env RIG_TARGET_STATE=parked ./ouster-up sensors/ouster.example.yaml up -d
          sed 's/^# initial_state: standby/initial_state: parked/' \
            sensors/ouster.example.yaml > "${RUNNER_TEMP}/bad.yaml"
          must_fail ./ouster-up "${RUNNER_TEMP}/bad.yaml" up -d

          # initial_state: standby needs a detached bring-up; with -d it runs `up -d` and
          # then polls/transitions via exec (stub exec fails -> settle timeout -> nonzero)
          sed 's/^# initial_state: standby/initial_state: standby/' \
            sensors/ouster.example.yaml > "${RUNNER_TEMP}/standby.yaml"
          must_fail ./ouster-up "${RUNNER_TEMP}/standby.yaml" up
          : > "${DOCKER_ARGV_LOG}"
          must_fail env OUSTER_STANDBY_SETTLE_TIMEOUT=5 \
            ./ouster-up "${RUNNER_TEMP}/standby.yaml" up -d
          grep -q ' up -d' "${DOCKER_ARGV_LOG}"
          grep -q ' exec -T driver /usr/local/bin/statectl.sh state' "${DOCKER_ARGV_LOG}"

          # RIG_TARGET_STATE=active beats a standby config: plain forwarded up, no statectl
          : > "${DOCKER_ARGV_LOG}"
          RIG_TARGET_STATE=active ./ouster-up "${RUNNER_TEMP}/standby.yaml" up -d 2>/dev/null
          must_fail grep -q statectl "${DOCKER_ARGV_LOG}"

  # ---------------------------------------------------------------------------
  # Shell hygiene on the deploy surface (launcher + build script + entrypoints).
  # ---------------------------------------------------------------------------
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck launcher + build script + entrypoints
        run: shellcheck ouster-up tools/build_image.sh docker/entrypoints/*.sh
